<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computacao Aplicada - Seletor</title>
</head>
<body>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const forced = params.get('view');
    const isMobile = window.matchMedia('(max-width: 900px)').matches || navigator.maxTouchPoints > 0;
    const target = forced === 'desktop'
      ? 'index.desktop.html'
      : forced === 'mobile'
        ? 'index.mobile.html'
        : (isMobile ? 'index.mobile.html' : 'index.desktop.html');
    if (!window.location.pathname.endsWith('/' + target)) {
      window.location.replace(target + window.location.search + window.location.hash);
    }
  })();
</script>
</body>
</html>
